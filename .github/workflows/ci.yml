name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trabaho_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable CI-only databases and credentials; nothing here is secret.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/trabaho_test
      TEST_APP_ROLE_DATABASE_URL: postgres://trabaho_app:ci-only@localhost:5432/trabaho_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create restricted runtime role
        run: psql postgres://postgres:postgres@localhost:5432/postgres -c "CREATE ROLE trabaho_app LOGIN PASSWORD 'ci-only'"
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trabaho_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/trabaho_e2e
      E2E_APP_DATABASE_URL: postgres://trabaho_app:ci-only@localhost:5432/trabaho_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create restricted runtime role
        run: psql postgres://postgres:postgres@localhost:5432/postgres -c "CREATE ROLE trabaho_app LOGIN PASSWORD 'ci-only'"
      - name: Generate a throwaway auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 48 | tr -d '\n')" > .dev.vars
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
